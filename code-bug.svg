<svg width="100%" height="160" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Glow Filters -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- GitHub Dark Background -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Faint Background Code (Easter Eggs) -->
  <g fill="#0d2137" font-family="'Courier New', monospace" font-size="13" font-weight="bold">
    <text x="20" y="30">import { OdooEnvironment } from 'odoo/core';</text>
    <text x="20" y="55">const feature = new Bug({ hidden: true });</text>
    <text x="650" y="110">while (developer.isCoding()) {</text>
    <text x="680" y="130">bugs.spawn();</text>
    <text x="650" y="150">}</text>
    <text x="310" y="80">/* "I engineer features. Bugs are a side product." */</text>
  </g>

  <!-- The Crawling Syntax Bug -->
  <g>
    <!-- Horizontal slide from left to right -->
    <animateTransform attributeName="transform" type="translate" from="-250,0" to="1100,0" dur="9s" repeatCount="indefinite" />
    
    <!-- Scurry / Bounce Animation -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="0.15s" repeatCount="indefinite" />

      <!-- Blinking Trail left behind -->
      <text x="-35" y="90" fill="#ff7b72" font-family="monospace" font-size="14" opacity="0.5">
        <animate attributeName="opacity" values="0.8; 0; 0.8" dur="0.4s" repeatCount="indefinite" />
        0101
      </text>
      <text x="-80" y="85" fill="#ff7b72" font-family="monospace" font-size="11" opacity="0.2">
        <animate attributeName="opacity" values="0; 0.6; 0" dur="0.7s" repeatCount="indefinite" />
        ERR!
      </text>

      <!-- Bug Legs (Top) -->
      <g fill="#79c0ff" font-family="'Courier New', monospace" font-size="24" font-weight="bold" filter="url(#glow-blue)">
        <!-- Front Top Leg -->
        <text x="140" y="50">
          <animateTransform attributeName="transform" type="rotate" values="10 140 50; -25 140 50; 10 140 50" dur="0.25s" repeatCount="indefinite" />
          /\
        </text>
        <!-- Middle Top Leg -->
        <text x="100" y="45">
          <animateTransform attributeName="transform" type="rotate" values="-20 100 45; 20 100 45; -20 100 45" dur="0.25s" repeatCount="indefinite" />
          /|
        </text>
        <!-- Back Top Leg -->
        <text x="60" y="50">
          <animateTransform attributeName="transform" type="rotate" values="25 60 50; -10 60 50; 25 60 50" dur="0.25s" repeatCount="indefinite" />
          /\
        </text>
      </g>

      <!-- Bug Legs (Bottom) -->
      <g fill="#79c0ff" font-family="'Courier New', monospace" font-size="24" font-weight="bold" filter="url(#glow-blue)">
        <!-- Front Bottom Leg -->
        <text x="140" y="115">
          <animateTransform attributeName="transform" type="rotate" values="-10 140 115; 25 140 115; -10 140 115" dur="0.25s" repeatCount="indefinite" />
          \/
        </text>
        <!-- Middle Bottom Leg -->
        <text x="100" y="120">
          <animateTransform attributeName="transform" type="rotate" values="20 100 120; -20 100 120; 20 100 120" dur="0.25s" repeatCount="indefinite" />
          |\
        </text>
        <!-- Back Bottom Leg -->
        <text x="60" y="115">
          <animateTransform attributeName="transform" type="rotate" values="-25 60 115; 10 60 115; -25 60 115" dur="0.25s" repeatCount="indefinite" />
          \/
        </text>
      </g>

      <!-- Bug Body (Constructed from Syntax) -->
      <g font-family="'Courier New', monospace" font-weight="bold" font-size="26" filter="url(#glow-red)">
        <!-- Stinger/Tail -->
        <text x="20" y="85" fill="#ff7b72">~</text>
        <!-- Abdomen -->
        <text x="40" y="88" fill="#d2a8ff">[0x0]</text>
        <!-- Thorax (Core) -->
        <text x="115" y="88" fill="#ff7b72">{<tspan fill="#3fb950">;</tspan>}</text>
        <!-- Head & Mandibles -->
        <text x="165" y="88" fill="#ff7b72">=></text>
        
        <!-- Glowing Green Eyes -->
        <text x="160" y="75" fill="#3fb950" font-size="16">.</text>
        <text x="160" y="95" fill="#3fb950" font-size="16">.</text>
      </g>
    </g>
  </g>
</svg>
