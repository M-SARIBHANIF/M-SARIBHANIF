<svg width="100%" height="110" viewBox="0 0 1000 110" xmlns="http://www.w3.org/2000/svg">
  <!-- Background matching your GitHub Dark profile -->
  <rect width="100%" height="100%" fill="#0d1117" />
  
  <!-- Horizontal Slide Animation -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-100,0" to="1100,0" dur="7s" repeatCount="indefinite" />
    
    <!-- Vertical Crawling/Bouncing Animation -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="0.4s" repeatCount="indefinite" />
      
      <!-- The Code Bug -->
      <text x="0" y="45" font-family="'Courier New', monospace" font-size="22" fill="#FF6B6B" font-weight="bold" text-anchor="middle"> \&lt;/ </text>
      <text x="0" y="65" font-family="'Courier New', monospace" font-size="22" fill="#58A6FF" font-weight="bold" text-anchor="middle">-[0]-</text>
      <text x="0" y="85" font-family="'Courier New', monospace" font-size="22" fill="#FF6B6B" font-weight="bold" text-anchor="middle"> /&gt;\ </text>
    </g>
  </g>
</svg>
